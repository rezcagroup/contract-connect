# Pulls fresh NYC DOB filings and Westchester County referrals every morning (the schedule fires several times a day because GitHub delays cron runs),
# uploads them to Supabase (where signed-in users read only the areas they picked), rebuilds the Contract Connect pages and publishes them with GitHub Pages.
# The published pages hold no project data.
# Needs repository secrets SUPABASE_URL and SUPABASE_SECRET_KEY (Settings -> Secrets and variables -> Actions).
# Needs: this file on the default branch, and Settings -> Pages -> Source set to "GitHub Actions".
# Nothing is committed back to the repo; the refreshed pages only go to the published site.
name: Refresh and publish

on:
  schedule:
    # GitHub often runs scheduled jobs hours late, so ask three times a day. A run that lands
    # after an earlier one just republishes the same pages with the latest data.
    - cron: "43 8 * * *"    # about 3-4am New York time
    - cron: "43 11 * * *"   # about 6-7am
    - cron: "43 14 * * *"   # about 9-10am
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull NYC DOB filings
        # If NYC Open Data is down, publish with the NYC data already in the repo.
        continue-on-error: true
        env:
          NYC_APP_TOKEN: ${{ secrets.NYC_APP_TOKEN }}
        run: python3 pull_nyc.py
      - name: Pull Westchester County referrals
        # If the county service is down, publish with the Westchester data already in the repo.
        continue-on-error: true
        run: python3 pull_westchester.py
      - name: Upload data to Supabase
        # If Supabase is unreachable, users keep yesterday's data and the pages still publish.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 push_supabase.py
      - name: Build pages
        run: |
          python3 build.py
          mkdir _site
          cp index.html login.html areas.html westchester.html nyc.html cc.js cc.css ccmap.js _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Right after the upload, GitHub sometimes doesn't list the new artifact yet, and deploy-pages fails with
      # 'No artifacts named "github-pages" were found' (seen Nov 19, 22 and 23). Retry once after a short wait,
      # so one slow listing doesn't fail the run. If the retry fails too, the run still fails and you get the alert.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
